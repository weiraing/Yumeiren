name: 构建并发布

on:
  push:
    tags:
      - 'v*'            # 推送 v 开头的标签(如 v1.0.0)时：编译并创建 Release
  workflow_dispatch:    # 也允许在 Actions 页面手动触发(仅构建并上传 Artifact)
    inputs:
      version:
        description: '版本号(如 1.2.0)。留空则用仓库里的 VERSION 文件'
        required: false
        default: ''
        type: string

permissions:
  contents: write       # 创建 Release 需要写权限

jobs:
  build-windows:
    runs-on: windows-latest
    # 第三方源码的版本号只写在这一处 —— 缓存 key、下载 URL、下载后的完整性校验
    # 全从这两个变量取，所以「缓存里躺着哪版」和「URL 拉的哪版」不可能对不上。
    env:
      # 与本地 third_party/cubism/cubism-info.yml 的 `version:` 对齐。
      CUBISM_SDK_VERSION: '5-r.5'
      # GLEW 官方最新 release(2.3.1, 2026-01-24)。注意 GLEW 的 release 号与头文件里的
      # 版本宏**不一致** —— 2.3.1 这个包的 glew.h 写的是 GLEW_VERSION_MICRO 4，本机那份
      # 快照(2025-04-09)写的也是 4，但两个文件差了 785 行(扩展列表增补 + 一处 MinGW 的
      # GLAPI 兜底定义被移除)。本项目只用 glewInit 与核心 GL 类型，这点差异无影响；
      # 用官方 release 而不是 master 快照，是为了可复现 + 能钉 sha256(见下面准备步骤)。
      GLEW_VERSION: '2.3.1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 版本号解析要读标签与提交历史(见 cmake/Version.cmake)，浅克隆会让
          # `git describe --tags` 拿不到标签，所以必须完整检出。
          fetch-depth: 0

      # —— 版本号的唯一决策点 ——
      # 规则与 cmake/Version.cmake 的优先级一致：git 标签 > 手动输入 > VERSION 文件。
      # 定下来之后写进环境变量，后续所有步骤(CMake、校验、zip 名、Release 标题)
      # 都从这里取，保证「标签号 == exe 里的版本号 == 包名」三者不可能不一致。
      - name: 解析本次构建的版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v   = $env:GITHUB_REF_NAME -replace '^v', ''
            $src = "git 标签 $env:GITHUB_REF_NAME"
          } elseif ('${{ inputs.version }}' -ne '') {
            $v   = '${{ inputs.version }}'
            $src = "手动输入"
          } else {
            $v   = (Get-Content VERSION -Raw).Trim()
            $src = "VERSION 文件"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号 '$v' 不是 X.Y.Z 形式(来源：$src)"
          }
          "YUMEIREN_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "本次构建版本：$v(来源：$src)"
          "### 本次构建版本：``$v``(来源：$src)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # 标签是权威版本，VERSION 文件只是开发期默认值。两者不一致不阻断发布
      # (打个小补丁标签就发版是合理需求)，但必须显式提醒，否则版本号会悄悄漂开。
      - name: 检查标签与 VERSION 文件是否一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          if ($file -ne $env:YUMEIREN_VERSION) {
            Write-Host "::warning::标签是 $env:YUMEIREN_VERSION，但 VERSION 文件里写着 $file。本次以标签为准。建议把 VERSION 改成 $env:YUMEIREN_VERSION 后提交。"
          } else {
            Write-Host "标签与 VERSION 文件一致：$file"
          }

      - name: 安装 Qt 6.10 (MSVC 64 位)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'          # 若镜像暂缺此版本可改为 6.9.2
          arch: 'win64_msvc2022_64'
          # ⚠️ 必须显式装 qtmultimedia —— 它**不在**默认安装里，是独立 addon。
          # 不装的报错方向极具误导性：Qt6Config.cmake 明明找到了，却
          #   「it set Qt6_FOUND to FALSE ... Failed to find required Qt component
          #     "Multimedia"」，看着像 Qt 压根没装好，其实只是少装一个 addon。
          # 名字是 aqt 的模块 id（全小写、无分隔符）。查证方式 —— Qt 官方仓库的包名列表：
          #   https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/
          #     qt6_6102/qt6_6102/Updates.xml
          # 6.10.2 里多媒体只有 `qt.qt6.6102.addons.qtmultimedia` 一个包，
          # MultimediaWidgets 就装在它里面 —— **没有**单独的 qtmultimediawidgets。
          modules: 'qtmultimedia'
          cache: true

      # —— 第三方源码：Cubism SDK 与 GLEW ——
      #
      # 为什么不入库：`third_party/` 被 .gitignore 排除，这条规则当初**就是为 Cubism 的
      # 专有许可设的**(Core/ 走 Live2D Proprietary Software License，见
      # third_party/webview2/README.md 里记的既定决策)。本仓库是 PUBLIC，把 SDK 推上去
      # 等于替 Live2D 做再分发；CI 从官方源现取则属于「使用者自行取得 SDK 后在 CI 里用」，
      # 是另一回事。所以这里取、不入库，与本地开发者的做法保持一致。
      #
      # 顺带解决体积：整包 46MB(其中 Samples/ 占 29MB)，构建只要 Core/ + Framework/，
      # 下面只搬这两棵子树。
      #
      # 两条来源都已核实无需鉴权、可脚本化：
      #   Cubism  https://cubism.live2d.com/sdk-native/bin/CubismSdkForNative-<ver>.zip
      #   GLEW    https://github.com/nigels-com/glew/releases/download/glew-<ver>/glew-<ver>.zip
      - name: 缓存第三方源码 (Cubism SDK + GLEW)
        uses: actions/cache@v4
        with:
          path: |
            third_party/cubism
            third_party/glew
          key: thirdparty-cubism${{ env.CUBISM_SDK_VERSION }}-glew${{ env.GLEW_VERSION }}

      - name: 准备第三方源码 (Cubism SDK + GLEW)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cubismRoot = 'third_party/cubism'
          $glewRoot   = 'third_party/glew'

          # 判据点名到「构建真正会读的文件」，而不是「目录存不存在」—— 空目录、
          # 解压到一半、缓存被写坏，目录判据全都判成「有」。
          $cubismSentinels = @(
            "$cubismRoot/Framework/src/CubismFramework.cpp",
            "$cubismRoot/Core/include/Live2DCubismCore.h",
            "$cubismRoot/Core/dll/windows/x86_64/Live2DCubismCore.dll",
            "$cubismRoot/Core/dll/windows/x86_64/Live2DCubismCore.lib",
            "$cubismRoot/Framework/src/Rendering/OpenGL/Shaders/Standard/VertShaderSrc.vert"
          )
          $glewSentinels = @(
            "$glewRoot/include/GL/glew.h",
            "$glewRoot/src/glew.c"
          )

          function Test-AllPresent([string[]]$paths) {
            foreach ($p in $paths) {
              if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { return $false }
            }
            return $true
          }

          $tmp = Join-Path $env:RUNNER_TEMP 'thirdparty'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          # —— Cubism ——
          if (Test-AllPresent $cubismSentinels) {
            Write-Host 'Cubism SDK：缓存命中，跳过下载。'
          } else {
            $url = "https://cubism.live2d.com/sdk-native/bin/CubismSdkForNative-$env:CUBISM_SDK_VERSION.zip"
            $zip = Join-Path $tmp 'cubism.zip'
            Write-Host "Cubism SDK：下载 $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $tmp -Force

            # 压缩包顶层是 CubismSdkForNative-<ver>/，但这是官方自定的形状、没有承诺，
            # 所以断言而不是假设 —— 真改了名字时报的是一句能看懂的话，而不是后面
            # 「找不到 CubismFramework.cpp」。
            $src = Join-Path $tmp "CubismSdkForNative-$env:CUBISM_SDK_VERSION"
            if (-not (Test-Path -LiteralPath $src)) {
              throw "解压后没看到 $src —— 官方是不是改了压缩包内的顶层目录名？"
            }

            if (Test-Path $cubismRoot) { Remove-Item -Recurse -Force $cubismRoot }
            New-Item -ItemType Directory -Force -Path $cubismRoot | Out-Null
            # Samples/ 有 29MB(压缩包的大头)，构建用不到，不搬。
            foreach ($d in @('Framework', 'Core')) {
              Copy-Item -LiteralPath (Join-Path $src $d) -Destination $cubismRoot -Recurse -Force
            }
            # 许可与版本信息跟着走：产物里得能说清用了谁的代码、哪一版。
            foreach ($f in @('LICENSE.md', 'NOTICE.md', 'NOTICE.ja.md', 'cubism-info.yml', 'README.md')) {
              $p = Join-Path $src $f
              if (Test-Path -LiteralPath $p) { Copy-Item -LiteralPath $p -Destination $cubismRoot -Force }
            }

            # cubism-info.yml 里带着 SDK 自报的版本与 git 哈希，拿它当完整性佐证 ——
            # 比「文件在不在」强一层：能挡住「下到了另一版 SDK、而文件路径恰好相同」。
            $info = Get-Content -LiteralPath (Join-Path $cubismRoot 'cubism-info.yml') -Raw
            $expect = "version: $env:CUBISM_SDK_VERSION"
            if ($info -notmatch [regex]::Escape($expect)) {
              throw "cubism-info.yml 里没有 '$expect' —— 下载到的不是预期版本。"
            }
          }

          # —— GLEW ——
          if (Test-AllPresent $glewSentinels) {
            Write-Host 'GLEW：缓存命中，跳过下载。'
          } else {
            $ver = $env:GLEW_VERSION
            $url = "https://github.com/nigels-com/glew/releases/download/glew-$ver/glew-$ver.zip"
            $zip = Join-Path $tmp 'glew.zip'
            Write-Host "GLEW：下载 $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            # 官方 release 页公布了 sha256，钉死它 —— 这是唯一能挡住「下到半截的包」的
            # 判据，而且失败信息直指问题，不像编译期报错那样绕。
            $want = '09e0083ae46930aba9b53e72c92ee1a557e24ed393526fec26cb0ebabd834720'
            $got  = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want) { throw "glew-$ver.zip 校验失败：期望 $want，实际 $got" }

            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            $src = Join-Path $tmp "glew-$ver"
            if (-not (Test-Path -LiteralPath $src)) { throw "解压后没看到 $src" }

            if (Test-Path $glewRoot) { Remove-Item -Recurse -Force $glewRoot }
            New-Item -ItemType Directory -Force -Path $glewRoot | Out-Null
            # 只要 include/ 与 src/ —— 包里的 auto/ config/ doc/ build/ 是 GLEW 自己的
            # 构建体系，我们不碰第三方源码，也就不需要它们。
            foreach ($d in @('include', 'src')) {
              Copy-Item -LiteralPath (Join-Path $src $d) -Destination $glewRoot -Recurse -Force
            }
            Copy-Item -LiteralPath (Join-Path $src 'LICENSE.txt') -Destination $glewRoot -Force
          }

          # 统一收口：不管上面走的是缓存还是下载，都再断言一次。缓存命中后没有校验的话，
          # 一份写坏的缓存会被反复用下去、且从头到尾不报错。
          $missing = @(
            @($cubismSentinels + $glewSentinels) |
              Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          )
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "  缺：$_" }
            throw "第三方源码不完整（共 $($missing.Count) 个文件缺失，见上方清单）。"
          }
          Write-Host '第三方源码就位：Cubism SDK 与 GLEW 的关键文件齐全。'

      - name: 配置 CMake (MSVC, Release)
        shell: pwsh
        # ⚠️ -DYUMEIREN_VERSION 的值**必须带引号**，否则 PowerShell 会把它劈成两个参数：
        # 实测 `-DX=1.0.0` → `-DX=1` + `.0.0`（在**第一个点号**处截断，`-DX=abc.def`
        # 同样劈成 `-DX=abc` + `.def`）。于是 CMake 收到版本号 "1" 和一条多余的路径，
        # 报「版本号 '1' 不是 X.Y.Z（来源：explicit）」并 configure 失败。
        # 顺带一个反直觉点：`-DX=$env:Y` 不加引号时，`=` 后面的内容被当**字面量**，
        # 连变量展开都不会做 —— 所以这里引用的是环境变量，也必须加引号。
        # 值取自上一步写进 GITHUB_ENV 的 YUMEIREN_VERSION，与后面校验/包名同源。
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DYUMEIREN_VERSION=$env:YUMEIREN_VERSION"

      # 「探测式默认值」的代价就在这里：第三方源码没就位时 CMake 会**不声不响**退回占位
      # 实现(src/kanban/Live2DRendererStub.cpp)，构建照样全绿，只是看板娘是空的 ——
      # 之前几版 CI 产物就是这样，肉眼完全看不出来。这正是本次改动要消灭的失败模式，
      # 所以在编译之前先断言，别让它有机会悄悄发生。
      - name: 确认 Live2D 后端已启用
        shell: pwsh
        run: |
          $cache = Get-Content build/CMakeCache.txt -Raw
          if ($cache -notmatch 'YUMEIREN_WITH_LIVE2D:BOOL=ON') {
            throw 'YUMEIREN_WITH_LIVE2D 不是 ON —— 第三方源码没就位，本次会编成占位实现。'
          }
          Write-Host 'YUMEIREN_WITH_LIVE2D=ON（真 Live2D 后端）'

      - name: 编译 Yumeiren
        run: cmake --build build --config Release --target Yumeiren

      # 编译通过 ≠ 装得起来。Core 的 DLL 与 FrameworkShaders/ 是**运行期读盘**的：缺了
      # 不报错，只往日志写一行 "Failed to load vertex shader"，然后拿着 ShaderProgram=0
      # 一路画下去 —— 界面上什么都看不到。这两样由 yumeiren_runtime_cubism 在构建时补到
      # exe 旁，这里点名验收，免得它们没被带进后面的便携包。
      - name: 确认 Live2D 运行期文件已就位
        shell: pwsh
        run: |
          $need = @(
            'build/Release/Live2DCubismCore.dll',
            'build/Release/FrameworkShaders/VertShaderSrc.vert',
            'build/Release/FrameworkShaders/FragShaderSrc.frag'
          )
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "  缺：$_" }
            throw "Live2D 运行期文件缺失（共 $($missing.Count) 个）。"
          }
          Write-Host 'Live2D 运行期文件齐全。'

      # 这一步是「版本号真的贯通了」的证明：读的是 exe 里的 VERSIONINFO 资源，
      # 也就是 resources/app.rc.in 生成出来的东西。版本号若只在 CMake 变量里对、
      # 没写进资源，这里就会红。
      #
      # 产物名是品牌名「虞美人.exe」（CMakeLists 的 OUTPUT_NAME）。这个名字依赖
      # 工具链能把非 ASCII 路径原样传下去 —— 中文 Windows 的 GBK 装得下，所以本机
      # 实测通过；英文区域的 runner 装不下就会变成 `???.exe`，届时**编译那一步**
      # 就会失败（Ninja 找不到自己的产物），不会走到这里。真遇到就把 CMakeLists 里
      # 那段注释掉的「ASCII 产物名 + cmake -E 复制」方案启用。
      - name: 校验 exe 的版本资源与预期一致
        shell: pwsh
        run: |
          $vi = (Get-Item "build/Release/虞美人.exe").VersionInfo
          Write-Host "ProductVersion  = $($vi.ProductVersion)"
          Write-Host "FileVersion     = $($vi.FileVersion)"
          Write-Host "FileDescription = $($vi.FileDescription)"
          if ($vi.ProductVersion -ne $env:YUMEIREN_VERSION) {
            throw "版本不一致：exe 里是 '$($vi.ProductVersion)'，期望 '$env:YUMEIREN_VERSION'。说明 app.rc 没有跟着版本号走。"
          }
          if ($vi.FileVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "FileVersion '$($vi.FileVersion)' 不是 4 段数字形式(数字型版本装不下 +提交数.g短sha 后缀，这是预期行为)。"
          }

      - name: 部署 Qt 运行时并压缩为便携版
        shell: pwsh
        run: |
          $out = "build/Release"

          # —— 先让 windeployqt 找得到 MSVC 的再分发包 ——
          # `--compiler-runtime` 靠环境变量 VCINSTALLDIR 去定位 VS 的 Redist 目录，而 runner 的
          # pwsh 里**没有**这个变量。缺了它 windeployqt **不报错、直接跳过**，日志里只留一行：
          #   Warning: Cannot find Visual Studio installation directory, VCINSTALLDIR is not set.
          # 退出码仍是 0。实测 v1.0.2 那个包就是这样 —— 顶层 23 个文件里一个 CRT DLL 都没有，
          # 而 exe 与 Qt6*.dll 加起来有 24 处导入 vcruntime140.dll。后果不是「少点东西」：
          # 没装 VC++ 运行库的干净机器上双击 exe 直接弹「找不到 vcruntime140.dll」，根本起不来。
          # 所以这里先用 vswhere 把 VCINSTALLDIR 补上（这是 --compiler-runtime 能正常工作的前提，
          # 也是那行 Warning 消失的原因）；但**光有这个还不够** —— 见下面那段实测结论。
          $vsRoot = ''
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $vsRoot = @(& $vswhere -latest -products * -property installationPath)[0]
          }
          if ($vsRoot) {
            $env:VCINSTALLDIR = (Join-Path $vsRoot 'VC') + '\'
            Write-Host "VCINSTALLDIR = $env:VCINSTALLDIR"
          } else {
            Write-Host '::warning::vswhere 没找到 VS 安装目录，windeployqt 的 --compiler-runtime 会跳过；下面靠兜底拷贝补。'
          }

          # 拷贝 Qt DLL/插件与 VC 运行时到 exe 旁，做成免安装目录
          windeployqt --release --no-translations --compiler-runtime "$out/虞美人.exe"

          # —— MSVC C++ 运行时：兜底自己拷 ——
          # ⚠️ 实测（run 36026405728）：**光设 VCINSTALLDIR 是不够的**。Qt 6.10 的
          # windeployqt 在 MSVC 下并不是把 CRT DLL 拷过来，而是把 **vc_redist.x64.exe**
          # （18.7MB 的安装器）丢进输出目录 —— 那是给「让用户自己装运行库」的场景准备的，
          # 对便携包没用。所以 CRT DLL 这一步必须自己做，不能指望 --compiler-runtime。
          #
          # Redist 下会同时躺着**好几个 VS 版本**的 CRT（runner 上实测有 14.29 / 14.38 / 14.51
          # 三份），全都按 `Redist\MSVC\<版本>\x64\Microsoft.VC<NNN>.CRT` 摆放。取版本目录名
          # 倒序的第一个 —— 字符串序在这里等价于版本序（都是 14.XX.YYYYY，位数一致）。
          # MSVC 的 CRT 向后兼容（14.29 的 msvcp140.dll 跑 14.51 编出来的 exe 没问题），
          # 但没理由发旧的那份。debug_nonredist / onecore 不在 `<版本>\x64` 下，天然不会被选到。
          $crtNeeded = @(
            'vcruntime140.dll', 'vcruntime140_1.dll',
            'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll'
          )
          $crtMissing = @($crtNeeded | Where-Object { -not (Test-Path -LiteralPath (Join-Path $out $_) -PathType Leaf) })
          if ($crtMissing.Count -gt 0) {
            $crtSrc = @()
            if ($vsRoot) {
              $crtSrc = @(Get-ChildItem -Path (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory -ErrorAction SilentlyContinue |
                          Sort-Object Name -Descending |
                          ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
                          Select-Object -First 1)
            }
            if ($crtSrc.Count -eq 0) {
              throw "缺 MSVC 运行时（$($crtMissing -join ', ')），且在 VS 的 Redist 里也找不到 —— 发出去就是个双击起不来的包。"
            }
            # 只拷白名单里那几个，**不是** `*.dll` 一把梭。Redist 目录里同时还躺着
            # concrt140 / vccorlib140 / msvcp140_atomic_wait / msvcp140_codecvt_ids /
            # vcruntime140_threads —— 实测一个都不会被加载（三层证据见
            # cmake/TrimRuntimeFiles.cmake 文件头）。拷进来再删既白费 IO，又平白
            # 给了它们「哪天漏删」的机会。
            foreach ($dll in $crtNeeded) {
              Copy-Item -LiteralPath (Join-Path $crtSrc[0].FullName $dll) -Destination $out -Force
            }
            Write-Host "已从 $($crtSrc[0].FullName) 补齐 MSVC 运行时（$($crtNeeded.Count) 个）"
          }
          $crtMissing = @($crtNeeded | Where-Object { -not (Test-Path -LiteralPath (Join-Path $out $_) -PathType Leaf) })
          if ($crtMissing.Count -gt 0) { throw "MSVC 运行时仍缺：$($crtMissing -join ', ')" }
          Write-Host 'MSVC 运行时就位。'

          # —— 剔除运行时里用不到的文件 ——
          # 清单只有一份：cmake/TrimRuntimeFiles.cmake（本地构建也调它，见
          # cmake/DeployQtRuntime.cmake）。**不要**在这里再抄一遍清单 ——
          # 本地走 CMake 拷贝、CI 走 windeployqt，两条路径带进来的多余文件不同，
          # 但「哪些是无用的」是同一个事实，写两份必然漂移。
          #
          # 这条路径由 windeployqt 带进来的多余东西比本地多得多：图片格式插件
          # (qgif/qico/qsvg)、style 插件、触摸插件、TLS 后端、D3Dcompiler、
          # Qt6Svg / Qt6Concurrent。逐个核对过都没被加载 —— 端到端验证（视频壁纸
          # 起播 + 看板娘 Live2D 渲染首帧）与未删减的包逐行一致，0 条错误。
          $outAbs = (Resolve-Path -LiteralPath $out).Path
          & cmake -DTARGET_DIR="$outAbs" -P cmake/TrimRuntimeFiles.cmake
          if ($LASTEXITCODE -ne 0) { throw "运行时剔除失败（rc=$LASTEXITCODE）" }

          # 解压后要有一层顶层目录 Yumeiren/，而不是把 exe/DLL/data 直接摊在解压目录里
          # —— 那样在同一个目录里解两个版本会互相覆盖。
          # 不能靠 `Compress-Archive -Path $out` 拿到这层：那样顶层名会是源目录的**基名**
          # ("Release")，跟产品名对不上。所以先中转一份到 build/stage/Yumeiren/，
          # 再压那个目录(`-Path <目录>` 会把该目录本身作为顶层项收进包)。
          $stage = "build/stage/Yumeiren"
          if (Test-Path "build/stage") { Remove-Item -Recurse -Force "build/stage" }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$out/*" -Destination $stage -Recurse -Force

          # 构建中间产物不进包。MSVC 把静态库落在与 exe **同一个**输出目录（`build/Release/`），
          # 于是一句 `Copy-Item $out/*` 就把 `yumeiren_cubism_framework.lib` +
          # `yumeiren_glew.lib`（实测 4.9MB）一起发了出去 —— 用户解压后看到两个 .lib 只会困惑。
          # .exp / .pdb / .ilk 同理。**只扫顶层**：中间产物只可能挨着 exe，`data/` 这类子目录
          # 一个都不碰（按扩展名递归删会在素材目录里误伤）。
          $junkExt = @('.lib', '.exp', '.pdb', '.ilk', '.iobj', '.ipdb', '.tlog', '.obj', '.res', '.log')
          $junk = @(Get-ChildItem -LiteralPath $stage -File |
                    Where-Object { $junkExt -contains $_.Extension.ToLower() })
          if ($junk.Count -gt 0) {
            $junk | ForEach-Object { Write-Host "  剔除中间产物：$($_.Name)" }
            $junk | Remove-Item -Force
          }

          # windeployqt 在 MSVC 下放的 **vc_redist.x64.exe** 也摘掉：CRT DLL 已经由上面那步
          # 挨着 exe 摆好了，这个 18.7MB 的安装器对便携包没用 —— 留着只会让人以为「还得先装
          # 它」，还平白多占 16% 体积（实测包从 101MB 涨到 119MB，一半是它）。
          $redistInstaller = Join-Path $stage 'vc_redist.x64.exe'
          if (Test-Path -LiteralPath $redistInstaller) {
            Remove-Item -LiteralPath $redistInstaller -Force
            Write-Host '  已移除 vc_redist.x64.exe（CRT DLL 已就位，便携包不需要安装器）'
          }

          $zip = "Yumeiren-portable-v$env:YUMEIREN_VERSION-win64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "已打包：$zip(顶层目录 Yumeiren/)"

      # 直接验真正发出去的那个包，而不是它上游的目录 —— 中间任何一次拷贝漏了都拦得住。
      # 用解压后看目录的办法，而不是读 zip 条目：Compress-Archive 在不同 PowerShell 版本
      # 下生成的分隔符不一样(PS 5.1 用反斜杠)，按字符串比对条目名会莫名其妙地红。
      - name: 校验便携包内容
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'Yumeiren-portable-*.zip' | Select-Object -First 1
          if (-not $zip) { throw '没找到便携包' }

          $probe = Join-Path $env:RUNNER_TEMP 'zipcheck'
          if (Test-Path $probe) { Remove-Item -Recurse -Force $probe }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $probe -Force

          # 顶层只许有一个目录，且必须叫 Yumeiren —— 早先那版把 exe/DLL/data 直接摊在
          # 解压目录里，同一个目录解两个版本会互相覆盖。
          $tops = @(Get-ChildItem -LiteralPath $probe | Select-Object -ExpandProperty Name)
          if ($tops.Count -ne 1 -or $tops[0] -ne 'Yumeiren') {
            throw "便携包顶层不是唯一的 Yumeiren/：$($tops -join ', ')"
          }

          $root = Join-Path $probe 'Yumeiren'
          # exe 用通配而不是写死「虞美人.exe」：英文区域的 runner 未必装得下中文名，
          # 真发生那件事时上游「校验 exe 版本资源」那一步会先红，这里只需确认顶层有可执行文件。
          if (@(Get-ChildItem -LiteralPath $root -Filter '*.exe').Count -lt 1) {
            throw '便携包顶层没有 exe'
          }

          # 逐项点名。三类都是「缺了不报错、只是功能没了」的东西，只能靠这里拦：
          #   Live2D 后端 —— 缺了看板娘是空白的，日志里一行都没有；
          #   WebView2 Loader —— 缺了网页壁纸降级成「运行时不可用」；
          #   MSVC 运行时 —— 缺了干净机器上**根本起不来**（最狠的一类）。
          $need = @(
            'Live2DCubismCore.dll',
            'FrameworkShaders/VertShaderSrc.vert',
            'WebView2Loader.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll'
          )
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "  缺：$_" }
            throw "便携包里缺运行期文件（共 $($missing.Count) 项）—— 发出去就是个跑不起来的包。"
          }

          # data/ 是「素材缺失只降级、不报错」的那一类：四个子目录都得在，否则用户下到的
          # 是个看板娘没模型、图库空空的包。目录名来自 README 里写死的固定结构。
          $dataDirs = @('models', 'image', 'video', 'web')
          $noData = @($dataDirs | Where-Object { -not (Test-Path -LiteralPath (Join-Path $root "data/$_") -PathType Container) })
          if ($noData.Count -gt 0) {
            throw "便携包的 data/ 里缺子目录：$($noData -join ', ')"
          }

          # 反向判据：构建中间产物一个都不该出现在包里（打包那步剔过，这里验的是**真发出去
          # 的那个 zip**，中间任何一次拷贝把它带回来都拦得住）。
          $junkExt = @('.lib', '.exp', '.pdb', '.ilk', '.iobj', '.ipdb', '.tlog', '.obj')
          $junk = @(Get-ChildItem -LiteralPath $root -Recurse -File |
                    Where-Object { $junkExt -contains $_.Extension.ToLower() })
          if ($junk.Count -gt 0) {
            $junk | ForEach-Object { Write-Host "  多出来：$($_.FullName)" }
            throw "便携包里混进了 $($junk.Count) 个构建中间产物（见上方清单）。"
          }

          # 同理，运行库安装器也不该在便携包里 —— CRT DLL 才是我们发的东西。
          if (Test-Path -LiteralPath (Join-Path $root 'vc_redist.x64.exe') -PathType Leaf) {
            throw '便携包里混进了 vc_redist.x64.exe（windeployqt 放的运行库安装器）—— CRT DLL 已在包里，不需要它。'
          }

          # 反向判据：剔除清单里的无用文件一个都不该出现在包里。
          # 清单**现从** cmake/TrimRuntimeFiles.cmake 读，不在这里重列 —— 打包那步
          # 剔过，这里验的是真发出去的那个 zip，中间任何一次拷贝把它带回来都拦得住。
          # 清单走文件而不是 stdout：CMake 的 message() 走 stderr，管道接不到。
          $trimListFile = Join-Path $env:RUNNER_TEMP 'yumeiren-trim-list.txt'
          & cmake "-DPRINT_LIST=$trimListFile" -P cmake/TrimRuntimeFiles.cmake
          if ($LASTEXITCODE -ne 0) { throw "读剔除清单失败（rc=$LASTEXITCODE）" }
          $trimList = @(Get-Content -LiteralPath $trimListFile |
                        ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($trimList.Count -lt 5) {
            throw "从 cmake/TrimRuntimeFiles.cmake 读到的剔除清单只有 $($trimList.Count) 项，可疑（脚本被改坏了？）"
          }
          $stillThere = @($trimList | Where-Object {
            Test-Path -LiteralPath (Join-Path $root ($_ -replace '/', '\')) -PathType Leaf })
          if ($stillThere.Count -gt 0) {
            $stillThere | ForEach-Object { Write-Host "  该剔没剔：$_" }
            throw "便携包里还有 $($stillThere.Count) 个无用文件没被剔除（清单见上方）。"
          }
          Write-Host "已确认剔除清单里的 $($trimList.Count) 项都不在包里。"

          Write-Host '便携包校验通过：顶层 Yumeiren/，Live2D 后端 + WebView2 Loader + MSVC 运行时 + data/ 齐全，无中间产物。'

      - name: 上传构建产物(Artifact,保留 7 天)
        uses: actions/upload-artifact@v4
        with:
          name: Yumeiren-portable
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: 创建 Release 并上传便携版(源码包由 GitHub 自动附带)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yumeiren v${{ steps.ver.outputs.version }}
          files: ${{ env.ZIP_NAME }}
          # 默认行为是「找不到就警告、照样建一个没有附件的 Release」—— 那是最难发现的一种坏：
          # 页面看着发出去了，用户点进去没有包。宁可这一步红。
          fail_on_unmatched_files: true
          generate_release_notes: true
