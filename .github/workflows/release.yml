name: 构建并发布

on:
  push:
    tags:
      - 'v*'            # 推送 v 开头的标签(如 v1.0.0)时：编译并创建 Release
  workflow_dispatch:    # 也允许在 Actions 页面手动触发(仅构建并上传 Artifact)
    inputs:
      version:
        description: '版本号(如 1.2.0)。留空则用仓库里的 VERSION 文件'
        required: false
        default: ''
        type: string

permissions:
  contents: write       # 创建 Release 需要写权限

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 版本号解析要读标签与提交历史(见 cmake/Version.cmake)，浅克隆会让
          # `git describe --tags` 拿不到标签，所以必须完整检出。
          fetch-depth: 0

      # —— 版本号的唯一决策点 ——
      # 规则与 cmake/Version.cmake 的优先级一致：git 标签 > 手动输入 > VERSION 文件。
      # 定下来之后写进环境变量，后续所有步骤(CMake、校验、zip 名、Release 标题)
      # 都从这里取，保证「标签号 == exe 里的版本号 == 包名」三者不可能不一致。
      - name: 解析本次构建的版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v   = $env:GITHUB_REF_NAME -replace '^v', ''
            $src = "git 标签 $env:GITHUB_REF_NAME"
          } elseif ('${{ inputs.version }}' -ne '') {
            $v   = '${{ inputs.version }}'
            $src = "手动输入"
          } else {
            $v   = (Get-Content VERSION -Raw).Trim()
            $src = "VERSION 文件"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号 '$v' 不是 X.Y.Z 形式(来源：$src)"
          }
          "YUMEIREN_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "本次构建版本：$v(来源：$src)"
          "### 本次构建版本：``$v``(来源：$src)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # 标签是权威版本，VERSION 文件只是开发期默认值。两者不一致不阻断发布
      # (打个小补丁标签就发版是合理需求)，但必须显式提醒，否则版本号会悄悄漂开。
      - name: 检查标签与 VERSION 文件是否一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          if ($file -ne $env:YUMEIREN_VERSION) {
            Write-Host "::warning::标签是 $env:YUMEIREN_VERSION，但 VERSION 文件里写着 $file。本次以标签为准。建议把 VERSION 改成 $env:YUMEIREN_VERSION 后提交。"
          } else {
            Write-Host "标签与 VERSION 文件一致：$file"
          }

      - name: 安装 Qt 6.10 (MSVC 64 位)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'          # 若镜像暂缺此版本可改为 6.9.2
          arch: 'win64_msvc2022_64'
          # ⚠️ 必须显式装 qtmultimedia —— 它**不在**默认安装里，是独立 addon。
          # 不装的报错方向极具误导性：Qt6Config.cmake 明明找到了，却
          #   「it set Qt6_FOUND to FALSE ... Failed to find required Qt component
          #     "Multimedia"」，看着像 Qt 压根没装好，其实只是少装一个 addon。
          # 名字是 aqt 的模块 id（全小写、无分隔符）。查证方式 —— Qt 官方仓库的包名列表：
          #   https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/
          #     qt6_6102/qt6_6102/Updates.xml
          # 6.10.2 里多媒体只有 `qt.qt6.6102.addons.qtmultimedia` 一个包，
          # MultimediaWidgets 就装在它里面 —— **没有**单独的 qtmultimediawidgets。
          modules: 'qtmultimedia'
          cache: true

      - name: 配置 CMake (MSVC, Release)
        shell: pwsh
        # ⚠️ -DYUMEIREN_VERSION 的值**必须带引号**，否则 PowerShell 会把它劈成两个参数：
        # 实测 `-DX=1.0.0` → `-DX=1` + `.0.0`（在**第一个点号**处截断，`-DX=abc.def`
        # 同样劈成 `-DX=abc` + `.def`）。于是 CMake 收到版本号 "1" 和一条多余的路径，
        # 报「版本号 '1' 不是 X.Y.Z（来源：explicit）」并 configure 失败。
        # 顺带一个反直觉点：`-DX=$env:Y` 不加引号时，`=` 后面的内容被当**字面量**，
        # 连变量展开都不会做 —— 所以这里引用的是环境变量，也必须加引号。
        # 值取自上一步写进 GITHUB_ENV 的 YUMEIREN_VERSION，与后面校验/包名同源。
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DYUMEIREN_VERSION=$env:YUMEIREN_VERSION"

      - name: 编译 Yumeiren
        run: cmake --build build --config Release --target Yumeiren

      # 这一步是「版本号真的贯通了」的证明：读的是 exe 里的 VERSIONINFO 资源，
      # 也就是 resources/app.rc.in 生成出来的东西。版本号若只在 CMake 变量里对、
      # 没写进资源，这里就会红。
      #
      # 产物名是品牌名「虞美人.exe」（CMakeLists 的 OUTPUT_NAME）。这个名字依赖
      # 工具链能把非 ASCII 路径原样传下去 —— 中文 Windows 的 GBK 装得下，所以本机
      # 实测通过；英文区域的 runner 装不下就会变成 `???.exe`，届时**编译那一步**
      # 就会失败（Ninja 找不到自己的产物），不会走到这里。真遇到就把 CMakeLists 里
      # 那段注释掉的「ASCII 产物名 + cmake -E 复制」方案启用。
      - name: 校验 exe 的版本资源与预期一致
        shell: pwsh
        run: |
          $vi = (Get-Item "build/Release/虞美人.exe").VersionInfo
          Write-Host "ProductVersion  = $($vi.ProductVersion)"
          Write-Host "FileVersion     = $($vi.FileVersion)"
          Write-Host "FileDescription = $($vi.FileDescription)"
          if ($vi.ProductVersion -ne $env:YUMEIREN_VERSION) {
            throw "版本不一致：exe 里是 '$($vi.ProductVersion)'，期望 '$env:YUMEIREN_VERSION'。说明 app.rc 没有跟着版本号走。"
          }
          if ($vi.FileVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "FileVersion '$($vi.FileVersion)' 不是 4 段数字形式(数字型版本装不下 +提交数.g短sha 后缀，这是预期行为)。"
          }

      - name: 部署 Qt 运行时并压缩为便携版
        shell: pwsh
        run: |
          $out = "build/Release"
          # 拷贝 Qt DLL/插件与 VC 运行时到 exe 旁，做成免安装目录
          windeployqt --release --no-translations --compiler-runtime "$out/虞美人.exe"
          $zip = "Yumeiren-portable-v$env:YUMEIREN_VERSION-win64.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "已打包：$zip"

      - name: 上传构建产物(Artifact,保留 7 天)
        uses: actions/upload-artifact@v4
        with:
          name: Yumeiren-portable
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: 创建 Release 并上传便携版(源码包由 GitHub 自动附带)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yumeiren v${{ steps.ver.outputs.version }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
