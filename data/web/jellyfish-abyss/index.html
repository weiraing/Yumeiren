<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深海水母</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020817; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, jellies = [], plankton = [];

  function spawnJelly(atBottom) {
    const s = (34 + Math.random() * 52) * dpr;
    const hue = 165 + Math.random() * 135;
    const j = {
      x: (0.15 + Math.random() * 0.7) * W,
      y: atBottom ? H + s * 2.5 : Math.random() * H,
      s, hue, ph: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.14 * dpr,
      tent: Array.from({ length: 6 }, () =>
        Array.from({ length: 14 }, () => ({ x: 0, y: 0 })))
    };
    return j;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    jellies = Array.from({ length: 4 }, () => spawnJelly(false));
    plankton = Array.from({ length: 60 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (0.7 + Math.random() * 1.4) * dpr,
      v: (0.1 + Math.random() * 0.25) * dpr,
      a: 0.12 + Math.random() * 0.25
    }));
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.666, 3);
    last = now;
    const t = now / 1000;

    // 深海渐变
    const sea = ctx.createLinearGradient(0, 0, 0, H);
    sea.addColorStop(0, '#020817');
    sea.addColorStop(0.55, '#041d31');
    sea.addColorStop(1, '#07304d');
    ctx.fillStyle = sea;
    ctx.fillRect(0, 0, W, H);

    // 斜向光柱
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 3; ++i) {
      const bx = W * (0.22 + i * 0.3) + Math.sin(t * 0.07 + i * 2) * W * 0.04;
      const g = ctx.createLinearGradient(bx, 0, bx + W * 0.12, H);
      g.addColorStop(0, 'rgba(120,190,235,0.10)');
      g.addColorStop(1, 'rgba(120,190,235,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx, 0);
      ctx.lineTo(bx + W * 0.10, 0);
      ctx.lineTo(bx + W * 0.22 + H * 0.12, H);
      ctx.lineTo(bx + H * 0.12, H);
      ctx.closePath();
      ctx.fill();
    }
    // 浮游微粒上飘
    for (const p of plankton) {
      p.y -= p.v * dt;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      ctx.globalAlpha = p.a;
      ctx.fillStyle = '#bfe3ff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 水母
    for (const j of jellies) {
      const pulse = Math.sin(t * 1.4 + j.ph);
      const s = j.s * (1 + 0.09 * pulse);
      const rise = (0.10 + 0.14 * Math.max(0, pulse)) * dpr;
      j.y -= rise * dt;
      j.x += j.vx * dt + Math.sin(t * 0.3 + j.ph) * 0.12 * dpr * dt;
      if (j.y < -s * 3) {
        const nj = spawnJelly(true);
        Object.assign(j, { x: nj.x, y: nj.y, s: nj.s, hue: nj.hue, ph: nj.ph, tent: nj.tent });
      }

      ctx.save();
      ctx.translate(j.x, j.y);

      // 伞体柔光
      const halo = ctx.createRadialGradient(0, -s * 0.3, 0, 0, -s * 0.3, s * 2.1);
      halo.addColorStop(0, `hsla(${j.hue}, 90%, 70%, 0.20)`);
      halo.addColorStop(1, `hsla(${j.hue}, 90%, 70%, 0)`);
      ctx.fillStyle = halo;
      ctx.fillRect(-s * 2.2, -s * 2.4, s * 4.4, s * 4.4);

      // 触须：跟随链——每节缓动追向前一节，摆出飘带弧线
      for (let k = 0; k < j.tent.length; ++k) {
        const seg = j.tent[k];
        seg[0].x = j.x + (-0.75 + (1.5 * k) / (j.tent.length - 1)) * s;
        seg[0].y = j.y + s * 0.10;
        for (let m = 1; m < seg.length; ++m) {
          const pt = seg[m], prev = seg[m - 1];
          const tx = prev.x + Math.sin(t * 1.3 + m * 0.55 + k) * 1.6 * dpr;
          const ty = prev.y + s * 0.34;
          pt.x += (tx - pt.x) * 0.22;
          pt.y += (ty - pt.y) * 0.22;
        }
        for (let m = 1; m < seg.length; ++m) {
          const a = 0.55 * (1 - m / seg.length);
          ctx.strokeStyle = `hsla(${j.hue}, 85%, 72%, ${a})`;
          ctx.lineWidth = Math.max(1, 2.4 * dpr * (1 - m / seg.length));
          ctx.beginPath();
          ctx.moveTo(seg[m - 1].x, seg[m - 1].y);
          ctx.lineTo(seg[m].x, seg[m].y);
          ctx.stroke();
        }
      }

      // 伞体：穹顶 + 波浪下缘
      const bell = ctx.createRadialGradient(0, -s * 0.45, s * 0.1, 0, -s * 0.2, s * 1.35);
      bell.addColorStop(0, `hsla(${j.hue}, 95%, 82%, 0.85)`);
      bell.addColorStop(0.6, `hsla(${j.hue}, 90%, 66%, 0.42)`);
      bell.addColorStop(1, `hsla(${j.hue + 30}, 90%, 60%, 0.08)`);
      ctx.beginPath();
      ctx.moveTo(-s, s * 0.06);
      ctx.bezierCurveTo(-s * 1.02, -s * 0.95, s * 1.02, -s * 0.95, s, s * 0.06);
      const scallops = 4;
      for (let k = 0; k < scallops; ++k) {
        const x0 = s - (2 * s * k) / scallops;
        const x1 = s - (2 * s * (k + 1)) / scallops;
        ctx.quadraticCurveTo((x0 + x1) / 2, s * (0.24 - 0.07 * Math.abs(pulse)), x1, s * 0.06);
      }
      ctx.closePath();
      ctx.fillStyle = bell;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
