<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月下锦鲤池</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #031018; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let fish = [], pads = [], ripples = [], nextRipple = 0;

  function angDiff(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function makeFish(i) {
    const L = (Math.min(W, H) * (0.055 + Math.random() * 0.05));
    const gold = Math.random() < 0.35;
    return {
      x: Math.random() * W, y: H * (0.2 + Math.random() * 0.7),
      a: Math.random() * 6.28,
      sp: (0.25 + Math.random() * 0.3) * (L * 0.045),
      L, gold,
      ph: Math.random() * 6.28,
      swim: 4 + Math.random() * 3,
      wob: 0.4 + Math.random() * 0.5,
      patches: gold ? [] : Array.from({ length: 2 + (Math.random() * 2 | 0) }, () => ({
        x: -0.3 + Math.random() * 0.7,
        y: (Math.random() - 0.5) * 0.7,
        rx: 0.10 + Math.random() * 0.14,
        ry: 0.25 + Math.random() * 0.3,
        red: Math.random() < 0.4
      }))
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    if (!fish.length) {
      fish = Array.from({ length: 7 }, (_, i) => makeFish(i));
      pads = Array.from({ length: 4 }, () => ({
        x: Math.random() * W, y: H * (0.1 + Math.random() * 0.8),
        r: Math.min(W, H) * (0.05 + Math.random() * 0.045),
        rot: Math.random() * 6.28,
        drift: (Math.random() - 0.5) * 0.15
      }));
    } else {
      fish.forEach(f => { f.L = Math.min(f.L, Math.min(W, H) * 0.1); });
    }
  }

  function drawFish(f, t) {
    const L = f.L, wag = Math.sin(t * f.swim + f.ph);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.a);

    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.quadraticCurveTo(L * 0.15, -L * 0.15, -L * 0.2, -L * 0.10 + wag * L * 0.07);
    ctx.quadraticCurveTo(-L * 0.4, -L * 0.06 + wag * L * 0.16, -L * 0.52, wag * L * 0.22);
    ctx.quadraticCurveTo(-L * 0.4, L * 0.06 + wag * L * 0.16, -L * 0.2, L * 0.10 + wag * L * 0.07);
    ctx.quadraticCurveTo(L * 0.15, L * 0.15, L * 0.5, 0);
    ctx.closePath();

    if (f.gold) {
      ctx.fillStyle = 'rgba(255,178,64,0.92)';
    } else {
      ctx.fillStyle = 'rgba(242,246,255,0.92)';
    }
    ctx.fill();
    ctx.save();
    ctx.clip();
    for (const p of f.patches) {
      ctx.fillStyle = p.red ? 'rgba(226,72,54,0.9)' : 'rgba(255,132,42,0.9)';
      ctx.beginPath();
      ctx.ellipse(p.x * L, p.y * L * 0.5, p.rx * L, p.ry * L * 0.4, 0, 0, 7);
      ctx.fill();
    }
    ctx.restore();

    // 尾鳍薄纱
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.moveTo(-L * 0.38, wag * L * 0.08);
    ctx.quadraticCurveTo(-L * 0.62, wag * L * 0.26 - L * 0.12, -L * 0.72, wag * L * 0.3 - L * 0.04);
    ctx.quadraticCurveTo(-L * 0.58, wag * L * 0.22, -L * 0.72, wag * L * 0.3 + L * 0.06);
    ctx.quadraticCurveTo(-L * 0.62, wag * L * 0.26 + L * 0.12, -L * 0.38, wag * L * 0.08);
    ctx.fill();

    // 眼
    ctx.fillStyle = '#1a1a22';
    ctx.beginPath();
    ctx.arc(L * 0.34, -L * 0.07, L * 0.035, 0, 7);
    ctx.arc(L * 0.34, L * 0.07, L * 0.035, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    const t = now / 1000;

    // 水体
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#072733');
    bg.addColorStop(1, '#031018');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 月与倒影
    const mx = W * 0.78, my = H * 0.16, mr = Math.min(W, H) * 0.07;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3);
    mg.addColorStop(0, 'rgba(235,242,255,0.9)');
    mg.addColorStop(0.25, 'rgba(210,225,255,0.35)');
    mg.addColorStop(1, 'rgba(210,225,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);

    ctx.fillStyle = 'rgba(238,244,255,0.95)';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, 7);
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    for (let y = my + mr; y < H; y += 7 * dpr) {
      const w = mr * (1.4 - (y - my) / H) * (0.6 + 0.4 * Math.sin(t * 1.4 + y * 0.05 / dpr));
      const off = Math.sin(y * 0.03 / dpr + t * 1.1) * mr * 0.35;
      ctx.globalAlpha = Math.max(0, 0.28 * (1 - (y - my) / (H - my)));
      ctx.fillStyle = '#cfe0ff';
      ctx.fillRect(mx + off - w / 2, y, w, 2.2 * dpr);
    }
    ctx.globalAlpha = 1;

    // 波光
    for (let i = 0; i < 4; i++) {
      const yy = H * (0.3 + i * 0.18) + Math.sin(t * 0.5 + i) * 30 * dpr;
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = '#9fe8ff';
      ctx.save();
      ctx.translate(W / 2, yy);
      ctx.rotate(-0.12);
      ctx.fillRect(-W, -8 * dpr, W * 2, 16 * dpr);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 荷叶
    for (const p of pads) {
      p.x += Math.cos(p.rot) * p.drift * dpr;
      p.y += Math.sin(p.rot) * p.drift * dpr;
      p.rot += 0.001;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(t * 0.05 + p.r);
      ctx.fillStyle = 'rgba(46,110,72,0.85)';
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0.25, Math.PI * 2 - 0.25);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,190,130,0.5)';
      ctx.lineWidth = 1.5 * dpr;
      ctx.stroke();
      ctx.restore();
    }

    // 涟漪
    if (t > nextRipple) {
      ripples.push({ x: Math.random() * W, y: Math.random() * H, r: 0, max: (60 + Math.random() * 90) * dpr });
      nextRipple = t + 0.8 + Math.random() * 1.4;
    }
    ctx.strokeStyle = 'rgba(200,235,255,0.5)';
    ctx.lineWidth = 1.5 * dpr;
    ripples = ripples.filter(rp => {
      rp.r += 0.7 * dpr;
      const a = 1 - rp.r / rp.max;
      if (a <= 0) return false;
      ctx.globalAlpha = a * 0.5;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, 7);
      ctx.stroke();
      return true;
    });
    ctx.globalAlpha = 1;

    // 锦鲤
    for (const f of fish) {
      f.a += Math.sin(t * f.wob + f.ph) * 0.02;
      const m = Math.min(W, H) * 0.12;
      const toC = Math.atan2(H / 2 - f.y, W / 2 - f.x);
      if (f.x < m || f.x > W - m || f.y < m || f.y > H - m) {
        f.a += angDiff(f.a, toC) * 0.06;
      }
      f.x += Math.cos(f.a) * f.sp;
      f.y += Math.sin(f.a) * f.sp;
      drawFish(f, t);
    }

    // 暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,10,16,0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
