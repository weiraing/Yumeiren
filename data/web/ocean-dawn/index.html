<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海上日出</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1c2c; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const HORIZON = 0.58;           // 海平线高度比例
  let clouds = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    clouds = Array.from({ length: 5 }, (_, i) => ({
      x: Math.random() * W, y: H * (0.10 + Math.random() * 0.28),
      w: W * (0.14 + Math.random() * 0.16),
      v: (0.004 + Math.random() * 0.006) * dpr,
      a: 0.10 + Math.random() * 0.10
    }));
  }

  // 一层海浪：多条正弦叠加出的起伏填充面
  function wave(t, yBase, amp, len, speed, color) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    const step = Math.max(4, W / 240);
    for (let x = 0; x <= W + step; x += step) {
      const y = H * yBase
        + Math.sin(x / len + t * speed) * amp
        + Math.sin(x / (len * 0.37) - t * speed * 1.6) * amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  let last = performance.now();
  function frame(now) {
    const t = now / 1000;

    // 晨昏天空
    const sky = ctx.createLinearGradient(0, 0, 0, H * HORIZON);
    sky.addColorStop(0, '#0d2440');
    sky.addColorStop(0.55, '#28527a');
    sky.addColorStop(0.85, '#d98a4e');
    sky.addColorStop(1, '#f7c873');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H * HORIZON + 2);

    // 太阳(缓慢起伏)与光晕
    const sx = W * 0.5, sy = H * (HORIZON - 0.10) + Math.sin(t * 0.18) * H * 0.012;
    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.30);
    glow.addColorStop(0, 'rgba(255,222,160,0.95)');
    glow.addColorStop(0.12, 'rgba(255,205,130,0.55)');
    glow.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H * HORIZON + 2);
    ctx.beginPath();
    ctx.arc(sx, sy, H * 0.055, 0, 7);
    ctx.fillStyle = '#ffe9bd';
    ctx.fill();

    // 云(缓慢漂移)
    for (const c of clouds) {
      c.x += c.v;
      if (c.x - c.w > W) c.x = -c.w;
      const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.w);
      cg.addColorStop(0, `rgba(255,235,215,${c.a})`);
      cg.addColorStop(1, 'rgba(255,235,215,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(c.x - c.w, c.y - c.w * 0.4, c.w * 2, c.w * 0.8);
    }

    // 海面底色(铺在天空与浪层之间，避免露出背景缝)
    ctx.fillStyle = '#16405c';
    ctx.fillRect(0, H * HORIZON - 1, W, H - H * HORIZON + 1);

    // 太阳在海面的倒影光斑(纵向拉伸的柔光椭圆，无硬边)
    ctx.save();
    ctx.translate(sx, H * (HORIZON + 0.10));
    ctx.scale(1, 3.2);
    const ref = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.085);
    ref.addColorStop(0, 'rgba(255,215,150,0.42)');
    ref.addColorStop(1, 'rgba(255,215,150,0)');
    ctx.fillStyle = ref;
    ctx.fillRect(-W * 0.09, -W * 0.09, W * 0.18, W * 0.18);
    ctx.restore();

    // 四层海浪，由远及近逐渐变深
    wave(t * 0.6 + 9, HORIZON + 0.020, H * 0.008, 190, 0.9, 'rgba(94,150,168,0.85)');
    wave(t * 0.5 + 4, HORIZON + 0.085, H * 0.011, 230, 0.7, 'rgba(56,113,136,0.90)');
    wave(t * 0.42 + 1, HORIZON + 0.180, H * 0.014, 260, 0.55, 'rgba(30,80,105,0.94)');
    wave(t * 0.36, HORIZON + 0.310, H * 0.018, 300, 0.45, 'rgba(16,52,74,0.98)');

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
