<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例 · 星空时钟</title>
<!--
  动态网页壁纸示例：纯 Canvas + requestAnimationFrame，无任何外部依赖。
  放在 data/web 下即可在「动态网页壁纸」页选用；改完用「应用」重新加载。
  本文件由构建期复制(只补不盖)落到 build/data/web，想改它请改项目里的 data/web。
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070f; }
  #sky { display: block; width: 100%; height: 100%; }
  #clock {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
    color: #dfe6ff; text-align: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    text-shadow: 0 2px 18px rgba(90, 130, 255, .55);
    user-select: none;
  }
  #time { font-size: 13vh; font-weight: 200; letter-spacing: .04em; }
  #date { font-size: 3.4vh; opacity: .75; margin-top: 1vh; letter-spacing: .3em; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="clock">
  <div id="time">--:--</div>
  <div id="date"></div>
</div>
<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var stars = [];
  var W = 0, H = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = [];
    var count = Math.round(W * H / 9000);
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        tw: Math.random() * Math.PI * 2,        // 闪烁相位
        ts: 0.4 + Math.random() * 1.2,          // 闪烁速度
        vy: 2 + Math.random() * 9               // 缓慢下落速度
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function draw(t) {
    // 夜空底色带一点纵向渐变
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#06070f');
    bg.addColorStop(0.6, '#0a1030');
    bg.addColorStop(1, '#101a3f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 星星：缓慢下落 + 正弦闪烁
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.vy / 60;
      if (s.y > H + 2) s.y = -2;
      var alpha = 0.35 + 0.65 * Math.abs(Math.sin(s.tw + t / 1000 * s.ts));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 时钟
    var now = new Date();
    document.getElementById('time').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('date').textContent =
      (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + WEEK[now.getDay()];

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
