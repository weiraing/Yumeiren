<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流光等离子</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  const HUES = [205, 268, 322, 168, 240, 348, 24];
  const blobs = HUES.map((hue, i) => ({
    hue,
    ax: 0.28 + Math.random() * 0.18,
    ay: 0.24 + Math.random() * 0.18,
    wx: 0.10 + Math.random() * 0.14,
    wy: 0.09 + Math.random() * 0.13,
    px: Math.random() * 6.28,
    py: Math.random() * 6.28,
    size: 0.34 + Math.random() * 0.22,
    ph: i * 1.3
  }));
  const dust = Array.from({ length: 40 }, () => ({
    x: Math.random(), y: Math.random(),
    r: 0.6 + Math.random() * 1.4,
    s: 0.008 + Math.random() * 0.02,
    p: Math.random() * 6.28
  }));

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
  }

  function frame(now) {
    const t = now / 1000;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05060d';
    ctx.fillRect(0, 0, W, H);

    // 大色团:加法混合，交叠处自然发亮
    ctx.globalCompositeOperation = 'lighter';
    const base = Math.min(W, H);
    for (const b of blobs) {
      const x = W * (0.5 + b.ax * Math.sin(t * b.wx + b.px));
      const y = H * (0.5 + b.ay * Math.cos(t * b.wy + b.py));
      const r = base * b.size * (1 + 0.12 * Math.sin(t * 0.3 + b.ph));
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${b.hue}, 85%, 58%, 0.42)`);
      g.addColorStop(0.5, `hsla(${b.hue}, 85%, 50%, 0.16)`);
      g.addColorStop(1, `hsla(${b.hue}, 85%, 45%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // 浮尘
    for (const d of dust) {
      const y = (d.y - t * d.s * 0.15 + 10) % 1;
      const x = (d.x + Math.sin(t * 0.3 + d.p) * 0.02 + 10) % 1;
      ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(t + d.p));
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath();
      ctx.arc(x * W, y * H, d.r * dpr, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 暗角收边
    ctx.globalCompositeOperation = 'source-over';
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(5,6,13,0)');
    vg.addColorStop(1, 'rgba(5,6,13,0.72)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
