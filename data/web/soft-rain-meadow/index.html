<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微风细雨·夜草坪</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04101a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let forest = null, stars = [], drops = [], ripples = [], blades = [];

  const rand = (a, b) => a + Math.random() * (b - a);

  // 远景密林剪影(离屏缓存)
  function renderForest() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const fir = (x, base, h, color) => {
      const w = h * 0.5;
      g.fillStyle = color;
      for (let k = 0; k < 3; ++k) {
        const lh = h * (0.6 - k * 0.15);
        const ly = base - k * h * 0.27;
        g.beginPath();
        g.moveTo(x, ly - lh);
        g.lineTo(x - w * (1 - k * 0.15), ly);
        g.lineTo(x + w * (1 - k * 0.15), ly);
        g.closePath();
        g.fill();
      }
    };
    const layer = (base, hMin, hMax, gap, color) => {
      let x = -gap * Math.random();
      while (x < W + gap) {
        fir(x, base - Math.random() * hMin * 0.25, hMin + Math.random() * (hMax - hMin), color);
        x += gap * rand(0.5, 1.2);
      }
      g.fillStyle = color;
      g.fillRect(0, base - 2, W, H - base + 2);
    };
    const meadowTop = H * 0.72;
    layer(meadowTop - H * 0.02, H * 0.10, H * 0.22, 70 * dpr, '#0a1a1e');
    layer(meadowTop + H * 0.01, H * 0.16, H * 0.32, 110 * dpr, '#061218');
    return c;
  }

  // 草坪草叶(按深度排序绘制)
  function makeBlades() {
    blades = [];
    const n = Math.floor(W / (3.2 * dpr));
    const meadowTop = H * 0.72;
    for (let i = 0; i < n; ++i) {
      const depth = Math.random();              // 0 远 1 近
      const baseY = meadowTop + (H - meadowTop) * (0.15 + depth * 0.9) * rand(0.85, 1.05);
      blades.push({
        x: rand(-20, W + 20),
        y: Math.min(baseY, H + 8),
        h: (18 + depth * 52) * dpr * rand(0.75, 1.2),
        lean: rand(-0.25, 0.25),
        phase: rand(0, Math.PI * 2),
        stiff: rand(0.6, 1.4),
        depth
      });
    }
    blades.sort((a, b) => a.depth - b.depth);
  }

  function makeStars() {
    stars = [];
    for (let i = 0; i < 90; ++i) {
      stars.push({ x: rand(0, W), y: rand(0, H * 0.45), r: rand(0.4, 1.3) * dpr, tw: rand(0, Math.PI * 2) });
    }
  }

  function resetDrop(d) {
    d.x = rand(-W * 0.1, W * 1.1);
    d.y = rand(-H, -10);
    d.v = (5 + Math.random() * 4) * dpr;
    d.len = (9 + Math.random() * 12) * dpr;
    d.a = rand(0.06, 0.22);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    forest = renderForest();
    makeStars();
    makeBlades();
    drops = [];
    for (let i = 0; i < 220; ++i) {
      const d = {};
      resetDrop(d);
      d.y = rand(0, H);
      drops.push(d);
    }
    ripples = [];
  }
  window.addEventListener('resize', resize);
  resize();

  let wind = 0;   // 当前风力(平滑趋近阵风目标)
  let windTo = 1, windNext = 0;

  function frame(t) {
    if (t > windNext) { windTo = rand(0.35, 1.6); windNext = t + rand(1800, 5200); }
    wind += (windTo - wind) * 0.012;
    const sway = Math.sin(t * 0.0011);
    const rainSkew = 0.10 + wind * 0.09;

    // 夜空
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#020a12');
    sky.addColorStop(0.55, '#08202c');
    sky.addColorStop(0.75, '#0c2c30');
    sky.addColorStop(1, '#07181c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 星
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(s.tw + t * 0.0015));
      ctx.fillStyle = '#bfe3e8';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // 林
    ctx.drawImage(forest, 0, 0);

    // 雾带
    const meadowTop = H * 0.72;
    for (let i = 0; i < 2; ++i) {
      const y = meadowTop - H * (0.10 - i * 0.05);
      const drift = Math.sin(t * 0.00013 + i * 2.7) * W * 0.06;
      const fg = ctx.createLinearGradient(0, y - 30 * dpr, 0, y + 42 * dpr);
      fg.addColorStop(0, 'rgba(120,160,165,0)');
      fg.addColorStop(0.5, `rgba(120,160,165,${0.05 + i * 0.03})`);
      fg.addColorStop(1, 'rgba(120,160,165,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(drift - W * 0.1, y - 30 * dpr, W * 1.2, 72 * dpr);
    }

    // 草地底色
    const gm = ctx.createLinearGradient(0, meadowTop, 0, H);
    gm.addColorStop(0, '#081c1a');
    gm.addColorStop(1, '#03100f');
    ctx.fillStyle = gm;
    ctx.fillRect(0, meadowTop, W, H - meadowTop);

    // 雨滴
    ctx.strokeStyle = '#9fd6e6';
    ctx.lineWidth = Math.max(1, 0.8 * dpr);
    for (const d of drops) {
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - rainSkew * d.len, d.y - d.len);
      ctx.stroke();
      d.y += d.v;
      d.x -= rainSkew * d.v * 0.5;
      const ground = meadowTop + (H - meadowTop) * rand(0.18, 1);
      if (d.y > H + 20 || (d.y > ground && Math.random() < 0.04)) {
        if (ripples.length < 46 && d.y < H) {
          ripples.push({ x: d.x, y: Math.min(d.y, H - 2 * dpr), r: 1.5 * dpr, life: 1 });
        }
        resetDrop(d);
      }
    }
    ctx.globalAlpha = 1;

    // 涟漪
    for (let i = ripples.length - 1; i >= 0; --i) {
      const rp = ripples[i];
      rp.r += 0.35 * dpr;
      rp.life -= 0.028;
      if (rp.life <= 0) { ripples.splice(i, 1); continue; }
      ctx.globalAlpha = rp.life * 0.35;
      ctx.strokeStyle = '#a8dbe8';
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 草叶(风摆)
    for (const b of blades) {
      const gust = Math.sin(t * 0.0016 + b.phase + b.x * 0.0022 / dpr);
      const bend = (wind * 0.5 + gust * 0.32) * b.stiff * b.h * 0.55 + b.lean * b.h * 0.3;
      const col = 26 + b.depth * 22;
      ctx.strokeStyle = `rgb(${Math.floor(col * 0.5)},${Math.floor(col)},${Math.floor(col * 0.75)})`;
      ctx.lineWidth = Math.max(1, (0.7 + b.depth * 1.5) * dpr);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.quadraticCurveTo(b.x + bend * 0.3, b.y - b.h * 0.6, b.x + bend, b.y - b.h);
      ctx.stroke();
    }

    // 细雨蒙层
    ctx.fillStyle = 'rgba(150,190,200,0.028)';
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
